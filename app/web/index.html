<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
<title>Moli</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <button class="icon" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
  <div class="title" id="title">Moli</div>
  <button class="link" id="updateBtn">Update</button>
</header>
<div class="progress" id="progress" hidden><div class="track"><div class="bar" id="bar"></div></div><div class="eta" id="eta"></div></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="dhead"><span class="mark">m</span><span class="dname">Moli</span></div>
  <nav id="tabs">
    <a data-tab="chat">Today</a>
    <a data-tab="home">Portfolio</a>
    <a data-tab="stocks">Stocks</a>
    <a data-tab="train">Train on the past</a>
    <a data-tab="brain">Brain</a>
    <a data-tab="journal">Journal</a>
    <a data-tab="more">Data &amp; settings</a>
  </nav>
  <div class="dfoot" id="dfoot"></div>
</aside>
<div class="scrim" id="scrim"></div>
<main id="view"></main>
<form class="composer" id="composer" autocomplete="off">
  <div class="sugg" id="sugg"></div>
  <div class="box">
    <textarea id="msg" rows="1" placeholder="Ask Moli or give an order…"></textarea>
    <button class="send" id="sendBtn" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
  </div>
</form>
<div class="toast" id="toast"></div>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
